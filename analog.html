<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Lab · Benchnote</title>
  <meta name="description" content="A free analog breadboard with a power supply, function generator, multimeter, ammeters and oscilloscope. Build any circuit; common experiments included as examples.">
  <meta name="author" content="Talha Yaseer Abeer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#15191d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/trainer.css">
  <link rel="stylesheet" href="css/analog-lab.css">
</head>
<body class="lab-page">
  <div class="lab">
    <aside class="lab-side" id="side" aria-label="Experiments">
      <input class="input side-search" id="search" type="search" placeholder="Search experiments or parts" aria-label="Search experiments">
      <button class="side-free" id="freeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v6M10 9v6M14 9v6M17 9v6"/></svg>
        <span>Free breadboard<small>Build any circuit you like</small></span>
      </button>
      <button class="side-free side-exam" id="examBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg>
        <span>Lab exam practice<small>A random task against the clock</small></span>
      </button>
      <p class="side-head">Ready-made examples</p>
      <p class="side-sub">Common lab experiments, already built. Open one to see it wired, then try it yourself.</p>
      <div id="expList"></div>
    </aside>

    <main class="lab-main">
      <header class="lab-head">
        <div class="crumbs"><button class="btn btn--sm side-toggle" id="sideBtn">Experiments</button><span>Analog Lab</span><span class="sep">/</span><span id="crumbGroup"></span></div>
        <div class="head-row">
          <div>
            <h1 id="title"></h1>
            <p class="aim" id="aim"></p>
          </div>
        </div>
        <div class="lab-tabs" role="tablist" id="tabs">
          <button role="tab" data-view="overview" aria-selected="true"><span class="num">1</span>Overview</button>
          <button role="tab" data-view="reference" aria-selected="false"><span class="num">2</span>Reference build</button>
          <button role="tab" data-view="practice" aria-selected="false"><span class="num">3</span>Practice</button>
          <button role="tab" data-view="fault" aria-selected="false"><span class="num">4</span>Find the fault</button>
        </div>
      </header>

      <section class="lab-view" data-pane="overview" id="overview"></section>

      <section class="lab-view is-bench" data-pane="reference" hidden>
        <div class="stages">
          <div class="pane is-readonly">
            <div class="pane-label"><span><span class="pill ref">Reference</span> Fully wired and running. Change the instruments; the wiring is locked.</span><span class="pane-tools" id="refTools"></span></div>
            <div class="board-host" id="refHost"></div>
            <div class="status-line" id="refStatus"></div>
          </div>
        </div>
        <aside class="lab-panel">
          <div class="panel-tabs" role="tablist" data-group="ref">
            <button role="tab" data-rt="steps" aria-selected="true">Wiring steps</button>
            <button role="tab" data-rt="try" aria-selected="false">Instruments</button>
            <button role="tab" data-rt="scope" aria-selected="false">Scope</button>
            <button role="tab" data-rt="inspect" aria-selected="false">Inspect</button>
          </div>
          <div class="panel-body" data-rp="steps" id="refSteps"></div>
          <div class="panel-body" data-rp="try" id="refTry" hidden></div>
          <div class="panel-body" data-rp="scope" id="refScope" hidden></div>
          <div class="panel-body" data-rp="inspect" id="refInspect" hidden></div>
        </aside>
      </section>

      <section class="lab-view is-bench" data-pane="practice" hidden>
        <div class="stages split" id="split">
          <div class="pane pane-ref is-readonly">
            <div class="pane-label"><span><span class="pill ref">Reference</span> read-only</span><button id="hideRef">Hide reference</button></div>
            <div class="board-host" id="miniHost"></div>
          </div>
          <div class="pane">
            <div class="pane-label"><span><span class="pill you">Your board</span> <span id="saveState" class="save-state"></span></span><span class="pane-tools" id="myTools"></span><button id="showRef" hidden>Show reference</button></div>
            <div class="board-host" id="myHost"></div>
            <div class="status-line" id="myStatus"></div>
          </div>
        </div>
        <aside class="lab-panel">
          <div class="panel-tabs" role="tablist" data-group="my">
            <button role="tab" data-mt="task" aria-selected="false" hidden>Task</button>
            <button role="tab" data-mt="parts" aria-selected="true">Parts</button>
            <button role="tab" data-mt="steps" aria-selected="false">Steps</button>
            <button role="tab" data-mt="meters" aria-selected="false">Instruments</button>
            <button role="tab" data-mt="scope" aria-selected="false">Scope</button>
            <button role="tab" data-mt="check" aria-selected="false">Check <span class="badge" id="issueBadge" hidden>0</span></button>
          </div>
          <div class="panel-body" data-mp="task" id="myTask" hidden></div>
          <div class="panel-body" data-mp="parts" id="myParts"></div>
          <div class="panel-body" data-mp="steps" id="mySteps" hidden></div>
          <div class="panel-body" data-mp="meters" id="myMeters" hidden></div>
          <div class="panel-body" data-mp="scope" id="myScope" hidden></div>
          <div class="panel-body" data-mp="check" id="myCheck" hidden></div>
        </aside>
      </section>
    </main>
  </div>
  <script type="module" src="js/analog-lab.js"></script>
</body>
</html>
